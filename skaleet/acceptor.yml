      properties:
        type:
          $ref: '#/components/schemas/ValidatorType'
        whitelist:
          type: array
          items:
            type: string
      x-stoplight:
        id: jh7cb824h7f2r
    LengthValidator:
      type: object
      required:
        - type
        - length
      properties:
        type:
          $ref: '#/components/schemas/ValidatorType'
        length:
          type: integer
      x-stoplight:
        id: gsqaf0cj1jurc
    MaxLengthValidator:
      type: object
      required:
        - type
        - maxLength
      properties:
        type:
          $ref: '#/components/schemas/ValidatorType'
        maxLength:
          type: integer
      x-stoplight:
        id: iota2bh9v24if
    MinLengthValidator:
      type: object
      required:
        - type
        - minLength
      properties:
        type:
          $ref: '#/components/schemas/ValidatorType'
        minLength:
          type: integer
      x-stoplight:
        id: 6mptgkj12b2rd
    PasswordValidator:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/ValidatorType'
        minLength:
          type: integer
        regexp:
          type: string
          description: regexp in PCRE format. Password must match this regexp
        forbidRegex:
          type: string
          description: regexp in PCRE format. Password must not match this regexp
        forbidDates:
          type: boolean
          description: 'if true, you cannot choose a date as a password'
        blacklist:
          type: array
          description: list of forbidden passwords
          example:
            - azerty
            - qwerty
            - '123456'
            - password
          items:
            type: string
