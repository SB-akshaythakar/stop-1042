  responses:
    ErrorResponse:
      description: Request could not be processed
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    RestfulErrorResponse:
      description: Request could not be processed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    VersionConflictResponse:
      description: The request could not be processed because the current version does not match the specified version
      content:
        application/json:
          schema:
            $ref: ./ConflictError.yaml
    DeviceAssociationResponse:
      description: Device association succeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Key'
    SuccessfulPreauthResponse:
      description: Preauth successful
      content:
        application/json:
          schema:
            type: object
            required:
              - session
              - transaction
            properties:
              session:
                $ref: '#/components/schemas/TransactionSession'
              transaction:
                $ref: '#/components/schemas/TransactionAccounting'
    SuccessfulTransactionResponse:
      description: 'Request successful, transaction was made'
      content:
        application/json:
          schema:
            type: object
            required:
              - transaction
            properties:
              transaction:
                $ref: '#/components/schemas/TransactionAccounting'
    PendingClientAuthenticationResponse:
