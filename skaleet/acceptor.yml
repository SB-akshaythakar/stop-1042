        type:
          $ref: '#/components/schemas/ValidatorType'
        max:
          type: number
      x-stoplight:
        id: y6vk2sbe6c6jm
    BetweenValidator:
      type: object
      required:
        - type
        - min
        - max
      properties:
        type:
          $ref: '#/components/schemas/ValidatorType'
        min:
