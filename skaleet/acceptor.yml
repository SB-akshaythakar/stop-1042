        schema:
          $ref: '#/components/schemas/QrCodeId'
    get:
      security:
        - OAuth2:
            - qr_code_management
      tags:
        - QRCode
      summary: Get QR code content
      operationId: GetAcceptorQrCodeContent
      responses:
        '200':
          description: QR code content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetQrCodeContentResponse'
        '404':
          description: QR code not found
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-stoplight:
        id: a0tqfobbouozo
  '/qr_code/{id}/display':
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/QrCodeId'
      - name: size
        in: query
        required: false
        schema:
          default: 200
          description: size in pixels of qrCode image to be generated
          type: integer
    get:
      security:
        - OAuth2:
            - qr_code_management
      tags:
        - QRCode
      summary: Get QR code image
      operationId: GetAcceptorQrCodeDisplay
      responses:
        '200':
          description: QR code image
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: QR code not found
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-stoplight:
        id: zeaf5e3wikzqd
