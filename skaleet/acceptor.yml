        - regex
      properties:
        type:
          $ref: '#/components/schemas/ValidatorType'
        regex:
          type: string
          description: regexp in PCRE format. Value must match this regexp
      x-stoplight:
        id: wydk5m2vim2zm
    ValidatorType:
      type: string
      enum:
        - AMOUNT
        - MIN
        - MAX
        - BETWEEN
        - BLACKLIST
        - LENGTH
        - MAX_LENGTH
        - MIN_LENGTH
        - PASSWORD
        - REGEX
        - WHITELIST
      x-stoplight:
        id: o1m0zr1znw6cw
    IdentityId:
      type: string
      example: '1'
      description: Identity unique identifier
