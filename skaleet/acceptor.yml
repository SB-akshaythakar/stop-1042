            $ref: ./AccountId.yaml
        - name: iban
          in: query
          schema:
            $ref: ./IBAN.yaml
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: ./AccountStatus.yaml
        - name: type
          in: query
          schema:
            description: Type de compte
            type: string
        - name: offset
          in: query
          description: Starting item position number
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: The number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 500
