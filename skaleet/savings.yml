                        minAmount: 100
                      - rate: '2'
                        minDuration: 2
                        minAmount: 100
                      - rate: '3'
                        minDuration: 1
                        minAmount: 200
                      - rate: '4'
                        minDuration: 2
                        minAmount: 200
                  distributionAreaCodes:
                    - distributionAreaCode1
                    - distributionAreaCode2
                  interestCapitalization: false
                  naturalPersonFormConfigurationCode: formConfigurationCode
                  legalEntityFormConfigurationCode: formConfigurationCode
                  nbdRule: SAME_DAY
                  generalAccountThirdPartyPayable: '1000036'
                  generalAccountInterestAccruals: '1000037'
