        capRate:
          description: The float index cap rate
          type: string
        floorRate:
          description: The float index floor rate
          type: string
        marginRate:
          type: string
        additionalMarginRate:
          type: string
        allInRate:
          type: string
        rateBasis:
          type: string
          enum:
            - RATE_BASIS_15_360
            - RATE_BASIS_30_360
            - RATE_BASIS_ACTUAL_360
            - RATE_BASIS_ACTUAL_365
            - RATE_BASIS_ACTUAL_ACTUAL
        accrualCycles:
          description: The list of different accrual cycles of interest linked to this contract
          type: array
          items:
            type: object
            properties:
              startDate:
                description: The cycle starting date
                type: string
                format: YYYY-MM-DD
                pattern: '^\d{4}-\d{2}-\d{2}$'
                example: '2024-05-01'
              maturityDate:
                description: The cycle maturity date
                type: string
                format: YYYY-MM-DD
                pattern: '^\d{4}-\d{2}-\d{2}$'
                example: '2024-05-31'
              endDate:
                description: The cycle ending date
                type: string
                format: YYYY-MM-DD
                pattern: '^\d{4}-\d{2}-\d{2}$'
                example: '2024-05-30'
              dueDate:
                description: The cycle due date
                type: string
                format: YYYY-MM-DD
                pattern: '^\d{4}-\d{2}-\d{2}$'
                example: '2024-05-31'
                nullable: true
              balance:
                description: The projected amount of generated interest
                type: object
                properties:
                  amount:
                    description: The amount
                    type: integer
                  currency:
                    description: The ISO 4217 currency code
                    type: string
                    enum:
                      - ALL
                      - DZD
                      - ARS
