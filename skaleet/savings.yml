        profileIds:
          type: array
          items:
            type: number
        marginRate:
          type: string
        calendarCode:
          description: The code of the calendar linked to this product
          type: string
        singleDeposit:
          description: Whether the product allows single deposits or multiple deposits
          type: boolean
        isEarlyWithdrawalAllowed:
          description: Whether the product allows early withdrawal
          type: boolean
        isOneProductPerThirdPartyEnabled:
          type: boolean
        earlyWithdrawalNoticePeriod:
          description: The number of days for the client to notify the bank before withdrawing its money. Required if isEarlyWithdrawalAllowed is true
          type: integer
          minimum: 0
          exclusiveMinimum: -1
        earlyWithdrawalPenaltyType:
          description: The type of penalty applied when the client withdraws its money before the end of the term. Required if isEarlyWithdrawalAllowed is true
          type: string
          enum:
            - NOT_APPLICABLE
            - CONTRACT
        penaltyAccountExternalId:
          description: The external id of the penalty centralizing account. Required if isEarlyWithdrawalAllowed is true and for CONTRACT penalty type
          type: array
          items:
            type: string
        earlyWithdrawalPenalties:
          description: penalties apply when the client withdraws its money before the end of the term. Required for CONTRACT penalty type
          type: array
          items:
            type: object
            properties:
              rate:
                description: The rate of the penalty (%). Floating in string
                type: string
              startingCycle:
                description: The cycle when the penalty starts to apply. Several penalties with same startingCycle could not be apply on one product. At least one could start on cycle 0.
                type: integer
                minimum: 0
                exclusiveMinimum: -1
            required:
              - rate
              - startingCycle
        matrix:
          description: The parameters of the rate matrix
          type: object
          properties:
            frequency:
              type: string
              enum:
                - DAILY
                - WEEKLY
                - MONTHLY
                - QUARTERLY
                - SEMESTER
                - ANNUALLY
            isFrequencyMatrix:
              description: Whether the matrix is based on frequency
              type: boolean
            isAmountMatrix:
              description: Whether the matrix is based on amount
              type: boolean
            cells:
              description: The cells of the matrix
              type: array
              items:
                type: object
                properties:
                  rate:
                    description: The rate of the product given the corresponding values
                    type: string
                  minDuration:
                    description: The minimum duration of the contract for this cell
                    type: integer
                  minAmount:
                    description: The minimum amount of the contract for this cell
                    type: integer
                required:
                  - rate
          required:
            - frequency
            - isFrequencyMatrix
            - isAmountMatrix
            - cells
        additionalMarginSettings:
          description: Settings for allowing an additional margin on contracts associated with this product
          type: object
          properties:
            isAllowed:
              type: boolean
            minimum:
              type: string
            maximum:
              type: string
            default:
              type: string
          required:
            - isAllowed
        distributionAreaCodes:
          type: array
          items:
            type: string
        interestCapitalization:
          description: Whether the product's interest is capitalized
          type: boolean
        fifteenDaysMethod:
          description: Apply the 15 days method for interest calculation
          type: boolean
        isWithdrawalAllowed:
          description: Allow withdrawal on the product
          type: boolean
        naturalPersonFormConfigurationCode:
          description: Configuration form code used to validate related natural person contracts
          type: string
        legalEntityFormConfigurationCode:
          description: Configuration form code used to validate related legal entity contracts
          type: string
        naturalPersonEligibilityCriterias:
          description: Eligibility criterias for natural person
          type: object
          properties:
            type:
              type: string
              enum:
                - NATURAL_PERSON
            criterias:
              type: array
              items:
                oneOf:
                  - description: 'for boolean criterias, the value must be "true" or "false"'
                    type: object
                    properties:
                      cbsKycId:
                        type: string
                      value:
                        type: string
                      type:
                        type: string
                        enum:
                          - BOOLEAN
                      operator:
                        type: string
                        enum:
                          - EQUAL
                    required:
                      - cbsKycId
                      - value
                      - type
                      - operator
                  - description: 'for date criterias, the value must be a date string using format "yyyy-MM-dd" or "yyyy-MM-ddTHH:mm:ss"'
                    type: object
                    properties:
                      cbsKycId:
                        type: string
                      value:
                        type: string
                      type:
                        type: string
                        enum:
                          - DATE
                      operator:
                        type: string
                        enum:
                          - GREATER_THAN
                          - GREATER_THAN_OR_EQUAL
                          - LESS_THAN
                          - LESS_THAN_OR_EQUAL
                          - EQUAL
                          - DIFFERENT
                    required:
                      - cbsKycId
                      - value
                      - type
                      - operator
                  - type: object
                    properties:
                      cbsKycId:
                        type: string
                      value:
                        type: string
                      type:
                        type: string
                        enum:
                          - NUMBER
                      operator:
                        type: string
                        enum:
                          - EQUAL
                    required:
                      - cbsKycId
                      - value
