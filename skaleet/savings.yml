                      choices:
                        - 2
                        - 4
                        - 6
                        - 12
                        - 24
                    cycleFrequency: ANNUALLY
                    paymentFrequency: ATMATURITY
                    rateFixingDays: 2
                  balanceBoundaries:
                    minimum:
                      currency: EUR
                      value: 100
                    maximum:
                      currency: EUR
                      value: 220
                  profileIds:
