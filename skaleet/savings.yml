info:
  title: Savings
  description: |-
    Savings API| |
     ----|----|
     |Uses Cases Examples|**Savings Contracts Management**<br>- Create contract<br>- Manage contract lifecycle<br>- Deposit and Withdrawal<br>- Interest earning<br>**Savings Accounts Management**<br>- Create account<br>- Manage account lifecycle|

        This API is designed to empower developers to build for the financial institution its own intuitive user interfaces for managing savings module.
        This API may also help to seamlessly integrate with savings partners to enhance the financial services ecosystem.

        To use this API, a back-office has to create a Service Domain API key through its web portal. When creating or editing an API key, the back-office can specify the scopes available for this key, determining wether access to specific endpoints is authorized or not.
